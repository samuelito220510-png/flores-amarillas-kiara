<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>te amo kiara</title>

<!-- ╔══════════════════════════════════════════════════════════════╗
     ║   CONFIGURACIÓN RÁPIDA  —  edita SOLO esta parte              ║
     ║   1) Pon tu canción en la carpeta: assets/musica/           ║
     ║   2) Escribe abajo el nombre del archivo                    ║
     ╚══════════════════════════════════════════════════════════════╝ -->
<script>
  window.MI_CONFIG = {
    // El nombre de ella
    nombre: "Kiara",

    // Tu nombre (aparece en la firma de la carta)
    tuNombre: "te amo atte: samu 🌻",

    // La canción (pon el archivo dentro de assets/musica/ y escribe aquí su nombre)
    cancion: "assets/musica/Manuel Medrano - Donde Nadie Pueda Ir - Manuel Medrano.mp3",
    tituloCancion: "Te la dedico babe",

    // La carta / mensaje romántico (puedes cambiarlo todo)
    carta: [
      "el primer regalo que te hago pero bueno ajajja, mi primer amor, la primera mujer la cual ame de verdad, y la unica con la que he estado ahi siempre.",
      "Quien diria que a pesar de la distancia y de solo vernos una vez en persona viviriamos tantas experiencias y llamadas junto, gracias por siempre hacerme sentir comodo y amado te juro que no me arrepiento de ninguna experiencia vivida contigo.",
      "Entre todas las mujeres en este mundo siempre te escogeria a ti porque nadie me ha hecho sentir como tu lo has hecho, gracias por todo lo vivido a tu lado."
    ],

    fraseFinal: "No es el dia de las flores amarillas pero tu te las mereces todos los dias 🌻"
  };
</script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Quicksand:wght@400;500;600&family=Dancing+Script:wght@600;700&display=swap');

  :root{
    --amarillo: #ffcf33;
    --amarillo-suave: #ffe27a;
    --dorado: #f6a800;
    --miel: #b97e00;
    --crema: #fff9ec;
    --texto: #4a3b12;
    --sombra: rgba(180,130,0,.25);
    color-scheme: light;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    font-family:'Quicksand',system-ui,sans-serif;
    color:var(--texto);
    background:
      radial-gradient(1200px 600px at 50% -10%, #fff4cf 0%, transparent 60%),
      linear-gradient(180deg, #fffdf6 0%, #fff5da 40%, #ffefc2 100%);
    min-height:100vh;
    overflow-x:hidden;
  }
  #root{ position:relative; z-index:1; }

  /* ── Pétalos que caen ─────────────────────────────── */
  .petalos{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .petalo{
    position:absolute; top:-40px; font-size:26px;
    animation:caer linear infinite;
    opacity:.9; will-change:transform;
  }
  @keyframes caer{
    0%{ transform:translateY(-40px) rotate(0deg); }
    100%{ transform:translateY(105vh) rotate(360deg); }
  }

  /* ── HERO ─────────────────────────────────────────── */
  .hero{
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding: calc(env(safe-area-inset-top,0px) + 40px) 20px 60px;
    position:relative;
  }
  .sol{
    font-size:clamp(70px,16vw,130px);
    filter: drop-shadow(0 8px 24px var(--sombra));
    animation:latir 3.5s ease-in-out infinite;
  }
  @keyframes latir{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }

  .hero h1{
    font-family:'Playfair Display',serif;
    font-size:clamp(2.4rem,8vw,5rem);
    line-height:1.05; margin:.2em 0 .1em;
    color:var(--miel);
    text-shadow:0 3px 0 #fff, 0 6px 20px var(--sombra);
  }
  .hero .sub{
    font-family:'Dancing Script',cursive;
    font-size:clamp(1.6rem,5vw,2.6rem);
    color:var(--dorado);
  }
  .hero .fecha{
    margin-top:18px; letter-spacing:3px; text-transform:uppercase;
    font-size:.8rem; font-weight:600; color:var(--miel); opacity:.8;
  }
  .scroll-hint{
    position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
    font-size:.8rem; color:var(--miel); opacity:.75;
    animation:flotar 2s ease-in-out infinite;
  }
  @keyframes flotar{ 0%,100%{transform:translate(-50%,0)} 50%{transform:translate(-50%,10px)} }

  /* ── Secciones ────────────────────────────────────── */
  section{ padding: 70px 22px; max-width:1000px; margin:0 auto; }
  .titulo-seccion{
    font-family:'Playfair Display',serif;
    text-align:center; font-size:clamp(1.7rem,5vw,2.6rem);
    color:var(--miel); margin-bottom:8px;
  }
  .titulo-seccion .flor{ display:inline-block; animation:girar 8s linear infinite; }
  @keyframes girar{ to{ transform:rotate(360deg) } }
  .subtitulo-seccion{ text-align:center; color:var(--dorado); margin-bottom:38px; font-weight:500; }

  /* ── Carta ────────────────────────────────────────── */
  .carta{
    background:linear-gradient(180deg,#fffdf5,#fff7e0);
    border:1px solid #ffe6a3;
    border-radius:26px; padding:clamp(28px,6vw,54px);
    box-shadow:0 20px 60px -20px var(--sombra);
    position:relative;
  }
  .carta::before{ content:"🌼"; position:absolute; top:-22px; left:50%; transform:translateX(-50%); font-size:40px; }
  .carta p{
    font-size:clamp(1.05rem,2.6vw,1.3rem);
    line-height:1.9; margin-bottom:1.1em; text-align:center;
  }
  .carta p:first-child{ font-family:'Dancing Script',cursive; font-size:clamp(1.5rem,4vw,2rem); color:var(--miel); }
  .firma{
    text-align:right; font-family:'Dancing Script',cursive;
    font-size:1.7rem; color:var(--dorado); margin-top:20px;
  }

  /* ── Flores decorativas ───────────────────────────── */
  .flores-deco{ display:flex; justify-content:center; gap:clamp(10px,4vw,30px); flex-wrap:wrap; margin-top:10px; }
  .flores-deco span{ font-size:clamp(40px,10vw,70px); animation:latir 3.5s ease-in-out infinite; }
  .flores-deco span:nth-child(2){ animation-delay:.4s; }
  .flores-deco span:nth-child(3){ animation-delay:.8s; }
  .flores-deco span:nth-child(4){ animation-delay:1.2s; }
  .flores-deco span:nth-child(5){ animation-delay:1.6s; }

  /* ── Reproductor de música ────────────────────────── */
  .player{
    position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 18px); left:50%; transform:translateX(-50%);
    z-index:40; display:flex; align-items:center; gap:14px;
    background:rgba(255,255,255,.9); backdrop-filter:blur(10px);
    border:1px solid #ffe6a3; border-radius:50px;
    padding:10px 20px 10px 12px; box-shadow:0 14px 40px -10px var(--sombra);
    max-width:calc(100vw - 32px);
  }
  .player button{
    width:46px; height:46px; flex:0 0 auto; border:none; border-radius:50%;
    background:linear-gradient(145deg,var(--amarillo),var(--dorado));
    color:#5a3d00; font-size:20px; cursor:pointer; display:grid; place-items:center;
    box-shadow:0 6px 16px -4px var(--sombra); transition:transform .2s;
  }
  .player button:hover{ transform:scale(1.08); }
  .player .info{ min-width:0; }
  .player .info b{ display:block; font-size:.9rem; color:var(--miel); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .player .info span{ font-size:.72rem; color:var(--dorado); }
  .player.sonando .disco{ animation:girar 4s linear infinite; }
  .barra{ width:70px; height:4px; background:#ffe6a3; border-radius:4px; overflow:hidden; }
  .barra i{ display:block; height:100%; background:var(--dorado); width:0%; }

  footer{ text-align:center; padding:40px 20px 130px; color:var(--miel); }
  footer .big{ font-family:'Dancing Script',cursive; font-size:clamp(1.6rem,5vw,2.4rem); }

  @media (max-width:520px){
    .player .barra{ display:none; }
  }
</style>
</head>
<body>
  <div class="petalos" id="petalos"></div>
  <div id="root"></div>

  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>

  <script>
    /* Pétalos cayendo (fuera de React para no re-renderizar) */
    (function(){
      const cont = document.getElementById('petalos');
      const emojis = ['🌻','🌻','🌻','💛','🌻'];
      const N = window.innerWidth < 600 ? 14 : 26;
      for(let i=0;i<N;i++){
        const p = document.createElement('div');
        p.className='petalo';
        p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        p.style.left = Math.random()*100 + 'vw';
        p.style.fontSize = (16 + Math.random()*22) + 'px';
        p.style.animationDuration = (7 + Math.random()*9) + 's';
        p.style.animationDelay = (-Math.random()*12) + 's';
        p.style.opacity = 0.5 + Math.random()*0.5;
        cont.appendChild(p);
      }
    })();
  </script>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;
    const CFG = window.MI_CONFIG;

    function Player(){
      const audioRef = useRef(null);
      const [sonando, setSonando] = useState(false);
      const [progreso, setProgreso] = useState(0);
      const [hayError, setHayError] = useState(false);

      const toggle = () => {
        const a = audioRef.current;
        if(!a) return;
        if(sonando){ a.pause(); }
        else { a.play().catch(()=>setHayError(true)); }
      };

      useEffect(() => {
        const a = audioRef.current;
        if(!a) return;
        const onPlay = () => setSonando(true);
        const onPause = () => setSonando(false);
        const onTime = () => setProgreso(a.duration ? (a.currentTime/a.duration)*100 : 0);
        a.addEventListener('play', onPlay);
        a.addEventListener('pause', onPause);
        a.addEventListener('timeupdate', onTime);
        return () => { a.removeEventListener('play',onPlay); a.removeEventListener('pause',onPause); a.removeEventListener('timeupdate',onTime); };
      }, []);

      return (
        <div className={"player" + (sonando ? " sonando" : "")}>
          <audio ref={audioRef} src={CFG.cancion} loop onError={()=>setHayError(true)} />
          <button onClick={toggle} aria-label="Reproducir">
            <span className="disco">{sonando ? "❚❚" : "▶"}</span>
          </button>
          <div className="info">
            <b>{hayError ? "🎵 Agrega tu cancion" : CFG.tituloCancion}</b>
            <span>{hayError ? CFG.cancion.split('/').pop() : (sonando ? "Sonando…" : "Toca para reproducir")}</span>
          </div>
          <div className="barra"><i style={{width: progreso + "%"}} /></div>
        </div>
      );
    }

    function App(){
      return (
        <>
          <header className="hero">
            <div className="sol">🌻</div>
            <h1>{CFG.nombre}</h1>
            <div className="sub">tu eres mi flor amarilla</div>
            <div className="scroll-hint">desliza hacia abajo ↓</div>
          </header>

          <section>
            <h2 className="titulo-seccion">Una carta para ti <span className="flor">🌼</span></h2>
            <p className="subtitulo-seccion">Porque las palabras tambien florecen</p>
            <div className="carta">
              {CFG.carta.map((parrafo, i) => <p key={i}>{parrafo}</p>)}
              <div className="firma">{CFG.tuNombre} 💛</div>
            </div>
          </section>

          <section>
            <h2 className="titulo-seccion">Para ti, {CFG.nombre} <span className="flor">🌻</span></h2>
            <p className="subtitulo-seccion">Un ramo que nunca se marchita</p>
            <div className="flores-deco">
              <span>🌻</span><span>🌻</span><span>🌻</span><span>🌻</span><span>🌻</span>
            </div>
          </section>

          <footer>
            <div className="sol" style={{fontSize:'60px'}}>💛</div>
            <p className="big">{CFG.fraseFinal}</p>
            <p style={{marginTop:'10px', opacity:.7}}>Hecho con amor, solo para ti.</p>
          </footer>

          <Player />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
